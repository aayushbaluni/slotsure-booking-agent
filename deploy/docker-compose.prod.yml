# Production stack for a single VM (Oracle Cloud A1 or any Linux host): Postgres + API + Caddy.
# The API is NOT published to the host — only Caddy exposes 80/443 with TLS. Run via
# deploy/setup-vm.sh, or directly:
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slotsure
      POSTGRES_PASSWORD: slotsure
      POSTGRES_DB: slotsure
    volumes:
      - slotsure-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotsure -d slotsure"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .. # repo root (this file lives in deploy/)
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env # secrets + AGENT_ADAPTER=mcp, FAULTS_ENABLED, etc.
    environment:
      DATABASE_URL: postgresql://slotsure:slotsure@db:5432/slotsure?schema=public
      PORT: "3000"
    # no host ports — reached only via Caddy on the internal network
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # - ../apps/dashboard/dist:/srv/dashboard:ro   # uncomment to serve the dashboard too
    restart: unless-stopped

volumes:
  slotsure-pgdata:
  caddy_data:
  caddy_config:

# SlotSure API on Fly.io — always-on (no cold start, or the agent's first tool call times out),
# Mumbai region, MCP mode. See docs/DEPLOY.md. Secrets are set with `fly secrets set`, never here.
app = "slotsure-api"
primary_region = "bom" # Mumbai; use "sin" (Singapore) if you prefer

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "3000"
  AGENT_ADAPTER = "mcp"        # Phase 1 decision; /v1 REST stays available as a fallback
  FAULTS_ENABLED = "true"      # demo environment; set "false" for anything real
  BUSINESS_TZ = "Asia/Kolkata"
  LOG_LEVEL = "info"
  # set this to your deployed dashboard origin (CORS allow-list)
  DASHBOARD_ORIGIN = "https://slotsure-admin.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # always-on
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"       # allow migrate + seed on boot
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
